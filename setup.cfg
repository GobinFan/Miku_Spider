[metadata]
name = miku-ai
version = 0.1.0
description = Miku Spider - Weixin article crawler
author = MIKU Team
license = MIT

[options]
packages = find:
python_requires = >=3.10
install_requires =
    aiohttp==3.9.5
    aiosignal==1.3.1
    attrs==23.2.0
    beautifulsoup4==4.12.3
    bs4==0.0.2
    fake-useragent==1.5.1
    frozenlist==1.4.1
    idna==3.7
    multidict==6.0.5
    soupsieve==2.5
    yarl==1.9.4

[options.packages.find]
where = .
include =
    miku_ai
